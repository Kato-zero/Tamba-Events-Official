/* ---------- LOCALSTORAGE BACKEND (IMPROVED) ---------- */
function localSb() {
  const K = "tz_", SEED = "3", now = () => new Date().toISOString();
  const rd = (t, d) => {
    try {
      const v = localStorage.getItem(K + t);
      return v ? JSON.parse(v) : d;
    } catch (e) {
      console.warn("localStorage read failed:", e);
      return d;
    }
  };
  const wr = (t, v) => {
    try {
      const s = JSON.stringify(v);
      if (s.length > 5242880) { // 5MB check
        console.warn("Skipping write - data too large");
        return false;
      }
      localStorage.setItem(K + t, s);
      return true;
    } catch (e) {
      if (e.name === "QuotaExceededError") {
        console.warn("localStorage quota exceeded");
        return false;
      }
      console.warn("localStorage write failed:", e);
      return false;
    }
  };

  let seeded = false;
  const seed = () => {
    if (seeded) return;
    seeded = true;
    let ev = rd("events", []);
    if (localStorage.getItem(K + "seeded") !== SEED) ev = SAMPLES.map(({ demo, ...e }) => e);
    ev = ev.map(e => { const s = SAMPLES.find(z => z.id === e.id); return s ? { ...e, date: s.date } : e });
    wr("events", ev);
    wr("seeded", SEED);
  };

  function from(table) {
    let op = "select", fl = [], ord = null, pl = null, one = null;
    const b = {
      select() { return b },
      eq(c, v) { fl.push(r => r[c] === v); return b },
      neq(c, v) { fl.push(r => r[c] !== v); return b },
      order(c, o) { ord = [c, o && o.ascending === false]; return b },
      single() { one = "single"; return b },
      maybeSingle() { one = "maybe"; return b },
      insert(p) { op = "insert"; pl = p; return b },
      update(p) { op = "update"; pl = p; return b },
      upsert(p) { op = "upsert"; pl = p; return b },
      delete() { op = "delete"; return b },
      then(res, rej) {
        try {
          return Promise.resolve(run()).then(res, rej);
        } catch (e) {
          return Promise.reject(e);
        }
      }
    };
    function run() {
      if (table === "events") seed();
      let rows = table === "settings" ? [{ id: 1, fee: 5 }] : rd(table, []);
      const hit = r => fl.every(f => f(r));
      if (op === "insert") {
        const add = [].concat(pl).map(r => ({ ...r, created_at: now() }));
        if (!wr(table, [...rows, ...add])) return { data: null, error: { message: "Storage quota exceeded" } };
        return { data: add, error: null };
      }
      if (op === "upsert") {
        const i = rows.findIndex(r => r.id === pl.id);
        if (i >= 0) rows[i] = { ...rows[i], ...pl }; else rows.push({ ...pl, created_at: now() });
        if (!wr(table, rows)) return { data: null, error: { message: "Storage quota exceeded" } };
        return { data: [pl], error: null };
      }
      if (op === "update") {
        if (!wr(table, rows.map(r => hit(r) ? { ...r, ...pl } : r))) return { data: null, error: { message: "Storage quota exceeded" } };
        return { data: null, error: null };
      }
      if (op === "delete") {
        if (!wr(table, rows.filter(r => !hit(r)))) return { data: null, error: { message: "Storage quota exceeded" } };
        return { data: null, error: null };
      }
      const out = rows.filter(hit);
      if (ord) out.sort((x, y) => (x[ord[0]] > y[ord[0]] ? 1 : -1) * (ord[1] ? -1 : 1));
      if (one) return out.length ? { data: out[0], error: null } : { data: null, error: one === "single" ? { message: "Not found" } : null };
      return { data: out, error: null };
    }
    return b;
  }
  return {
    from,
    async rpc(fn, a) {
      if (fn === "buy_ticket") {
        seed();
        const ev = rd("events", []), e = ev.find(x => x.id === a.p_event_id), t = e && e.tiers.find(x => x.name === a.p_tier_name);
        if (!t) return { error: { message: "Ticket type not found" } };
        if (t.qty - t.sold < a.p_qty) return { error: { message: "Not enough tickets left" } };
        t.sold += a.p_qty;
        if (!wr("events", ev)) return { error: { message: "Storage quota exceeded" } };
        return { data: null, error: null };
      }
      return { data: null, error: null };
    },
    auth: {
      async getSession() { return { data: { session: rd("session", null) } } },
      async signUp({ email, password, options }) {
        const us = rd("users", []);
        if (us.some(u => u.email === email)) return { data: { user: null }, error: { message: "An account with this email already exists" } };
        const u = { id: "u_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), email, password, name: options?.data?.name || "" };
        if (!wr("users", [...us, u])) return { data: { user: null }, error: { message: "Storage quota exceeded" } };
        if (!wr("session", { user: { id: u.id, email } })) return { data: { user: null }, error: { message: "Storage quota exceeded" } };
        return { data: { user: { id: u.id } }, error: null };
      },
      async signInWithPassword({ email, password }) {
        const u = rd("users", []).find(x => x.email === email && x.password === password);
        if (!u) return { error: { message: "Incorrect email or password" } };
        if (!wr("session", { user: { id: u.id, email } })) return { error: { message: "Storage quota exceeded" } };
        return { error: null };
      },
      async signOut() { localStorage.removeItem(K + "session"); return {} },
      onAuthStateChange() { }
    }
  };
}

};
function shrink(f, max, cb) {
  if (!f) return;
  if (!f.type.startsWith("image/")) return toast("Choose an image file");
  if (f.size > 10485760) return toast("Image is too large (max 10MB)");
  const r = new FileReader();
  r.onerror = () => toast("Could not read that image");
  r.onload = x => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.width * k));
      c.height = Math.max(1, Math.round(im.height * k));
      const cx = c.getContext("2d");
      if (!cx) return toast("Canvas rendering failed");
      cx.drawImage(im, 0, 0, c.width, c.height);
      try {
        cb(c.toDataURL("image/jpeg", .8));
      } catch (e) {
        console.error("Image encoding error:", e);
        toast("Could not encode image");
      }
    };
    im.onerror = () => toast("Could not read that image");
    im.src = x.target.result;
  };
  r.readAsDataURL(f);
}

  document.body.appendChild(t);

function sheet(html) {
  const o = document.createElement("div");
  o.className = "ov";
  o.innerHTML = `<div class="sh"><div class="grab"></div>${html}</div>`;
  let d = 0;
  o.close = () => {
    if (d) return;
    d = 1;
    o.classList.add("out");
    setTimeout(() => {
      try { o.remove() } catch { }
    }, 230);
  };
  o.onclick = e => {
    if (e.target === o || e.target.closest("[data-x]")) o.close();
  };
  document.body.appendChild(o);
  return o;
}

function loadSaved() {
  try {
    SAVED = JSON.parse(localStorage.getItem("tz_saved") || "[]");
    if (!Array.isArray(SAVED)) SAVED = [];
  } catch {
    SAVED = [];
  }
}

const isSaved = id => SAVED.includes(id);
function toggleSave(id) {
  const was = isSaved(id);
  SAVED = was ? SAVED.filter(x => x !== id) : [...SAVED, id];
  try {
    localStorage.setItem("tz_saved", JSON.stringify(SAVED));
  } catch (e) {
    console.warn("Could not save favorites:", e);
    toast("Could not save this event");
    SAVED = was ? [...SAVED, id] : SAVED.filter(x => x !== id);
  }
  document.querySelectorAll(`[data-save="${id}"]`).forEach(b => b.classList.toggle("saved", !was));
  toast(was ? "Removed from saved" : "Saved for later");
}

async function loadMe() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { me = null; return }
    const { data: p, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
    if (error || !p) { 
      try { await sb.auth.signOut() } catch { }
      me = null;
      return;
    }
    if (p.suspended) {
      try { await sb.auth.signOut() } catch { }
      me = null;
      toast("This account has been suspended");
      return;
    }
    me = { ...p, email: session.user.email };
  } catch (e) {
    console.error("loadMe error:", e);
    me = null;
  }
}

      if (!isValidEmail(e)) return toast("Enter a valid email address");
      if (!isValidPhone(p)) return toast("Enter a valid phone number (at least 9 digits)");
      if (pw.length < 8) return toast("Password must be at least 8 characters");
      btn.disabled = true;
      try {
        const { data, error } = await sb.auth.signUp({ email: e, password: pw, options: { data: { name: n } } });
        if (error) { btn.disabled = false; return toast(error.message) }
        if (!data.user) { btn.disabled = false; return toast("Check your email to confirm, then sign in") }
        await sb.from("profiles").upsert({ id: data.user.id, name: n, phone: p, role }, { onConflict: "id" });
        await loadMe();
        await loadAll();
        drawTabs();
        m.close();
        toast("Welcome, " + n.split(" ")[0] + "!");
        if (after) after(); else go(role === "organiser" ? "org" : "home");
      } catch (e) {
        btn.disabled = false;
        console.error("Signup error:", e);
        toast("An error occurred during signup");
      }
    } else {
      const e = v("le"), pw = g("#lw").value;
      if (!isValidEmail(e)) return toast("Enter a valid email address");
      if (!pw) return toast("Enter your password");
      btn.disabled = true;
      try {
        const { error } = await sb.auth.signInWithPassword({ email: e, password: pw });
        if (error) { btn.disabled = false; return toast(error.message) }
        await loadMe();
        await loadAll();
        drawTabs();
        m.close();
        toast("Welcome back!");
        if (after) after(); else go(tab);
      } catch (e) {
        btn.disabled = false;
        console.error("Login error:", e);
        toast("An error occurred during login");
      }
    }
  }
  draw();
}

async function loadAll() {
  try {
    const [{ data: ev }, { data: st }] = await Promise.all([
      sb.from("events").select("*").neq("status", "suspended").order("date"),
      sb.from("settings").select("fee").eq("id", 1).maybeSingle()
    ]);
    if (ev) ALL = ev;
    if (st && typeof st.fee === "number") fee = st.fee;
    ALL = ALL.filter(e => !e.demo);
    if (SHOW_SAMPLES && !USE_LOCAL) ALL = [...ALL, ...SAMPLES];
    if (me) {
      const [{ data: my }, { data: tk }] = await Promise.all([
        sb.from("events").select("*").eq("owner", me.id),
        sb.from("tickets").select("*").eq("user_id", me.id).order("created_at", { ascending: false })
      ]);
      MINE = my || [];
      TIX = tk || [];
    } else {
      MINE = [];
      TIX = [];
    }
  } catch (e) {
    console.error("loadAll error:", e);
    ALL = SHOW_SAMPLES ? SAMPLES : [];
  }
}

const left = e => (e.tiers || []).reduce((s, t) => s + (t.qty - t.sold), 0);

function matchesDate(e) {
  if (!dateF) return true;
  const ed = e.date;
  if (dateF === "Today") return ed === today();
  if (dateF === "This weekend") {
    const d = new Date(), day = d.getDay();
    let fri, sun;
    if (day === 0) { fri = new Date(d); fri.setDate(fri.getDate() - 2); sun = d }
    else if (day === 6) { fri = new Date(d); fri.setDate(fri.getDate() - 1); sun = new Date(d); sun.setDate(sun.getDate() + 1) }
    else { fri = new Date(d); fri.setDate(fri.getDate() + (5 - day)); sun = new Date(fri); sun.setDate(sun.getDate() + 2) }
    return ed >= fri.toISOString().slice(0, 10) && ed <= sun.toISOString().slice(0, 10);
  }
  if (dateF === "Next week") {
    const d = new Date(), mon = new Date(d);
    mon.setDate(mon.getDate() + (1 + 7 - mon.getDay()));
    const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
    return ed >= mon.toISOString().slice(0, 10) && ed <= sun.toISOString().slice(0, 10);
  }
  return true;
}

function matchesPrice(e) {
  if (!priceF) return true;
  const p = minP(e);
  if (priceF === "Free") return p === 0;
  if (priceF === "ZMW 1-100") return p > 0 && p <= 100;
  if (priceF === "ZMW 100+") return p > 100;
  return true;
}

    return matchesDate(e) && matchesPrice(e);

    pst.removeEventListener("scroll", null);

  }

function initPS(root) {
  clearInterval(psT);
  psT = null;
  const t = root.querySelector(".pst");
  if (!t) return;
  const sl = [...t.children], dots = [...root.querySelectorAll(".dots i")];
  if (!sl.length) return;

  let actTimeout = null;
  const act = () => {
    clearTimeout(actTimeout);
    const c = t.scrollLeft + t.clientWidth / 2;
    let bi = 0, bd = Infinity;
    sl.forEach((x, i) => {
      const d = Math.abs(x.offsetLeft + x.offsetWidth / 2 - c);
      if (d < bd) { bd = d; bi = i }
    });
    sl.forEach((x, i) => {
      x.classList.toggle("on", i === bi);
      if (dots[i]) dots[i].classList.toggle("on", i === bi);
    });
    return bi;
  };

  const to = i => {
    if (!t || i < 0 || i >= sl.length) return;
    t.scrollTo({ left: sl[i].offsetLeft + sl[i].offsetWidth / 2 - t.clientWidth / 2, behavior: "smooth" });
  };

  let isScrolling = false;
  const play = () => {
    clearInterval(psT);
    if (sl.length <= 1 || isScrolling) return;
    psT = setInterval(() => {
      if (!isScrolling) to((act() + 1) % sl.length);
    }, 3800);
  };

  const scrollHandler = () => {
    act();
    clearInterval(psT);
  };
  const pointerStartHandler = () => { isScrolling = true; clearInterval(psT) };
  const pointerEndHandler = () => { isScrolling = false; psT = setTimeout(play, 6000) };

  t.addEventListener("scroll", scrollHandler, { passive: true });
  sl.forEach((x, i) => x.onclick = () => to(i));
  dots.forEach((d, i) => d.onclick = () => to(i));
  ["pointerdown", "touchstart", "wheel"].forEach(ev => t.addEventListener(ev, pointerStartHandler, { passive: true }));
  ["pointerup", "touchend"].forEach(ev => t.addEventListener(ev, pointerEndHandler, { passive: true }));

  act();
  play();
}

/* ---------- BUY ---------- */
function buy(id) {
  needAuth(() => {
    const e = ALL.find(x => x.id === id);
    if (!e) return;
    if (e.demo) return toast("Sample event: booking is disabled");
    if (ended(e)) return toast("This event has ended");
    if (!(e.tiers || []).length) return toast("No tickets available for this event");
    if (left(e) <= 0) return toast("Sold out");

    let ti = Math.max(0, e.tiers.findIndex(t => t.qty - t.sold > 0));
    let qty = 1, pay = "MTN", nm = me.name || "", ph = me.phone || "";
    const m = sheet(""), g = s => m.querySelector(s);

    const draw = () => {
      const t = e.tiers[ti], av = t.qty - t.sold, tot = t.price * qty;
      g(".sh").innerHTML = `<div class="grab"></div>` + sh("Get tickets", esc(e.title) + " · " + fdate(e.date)) +
        `<div class="fld"><label>Choose ticket type</label>${e.tiers.map((x, i) =>
          `<button class="tt ${i === ti ? "on" : ""}" data-ti="${i}" ${x.qty - x.sold <= 0 ? "disabled" : ""}>
            <span class="rd"></span>
            <span class="tn">${esc(x.name)}<small>${x.qty - x.sold <= 0 ? "Sold out" : (x.qty - x.sold) + " left"}</small></span>
            <b>${+x.price === 0 ? "Free" : money(x.price)}</b></button>`).join("")}</div>
        <div class="fld"><label>Quantity · ${av} left</label><div class="qty"><button id="qm" aria-label="Fewer">${I("minus")}</button><b>${qty}</b><button id="qp" aria-label="More">${I("plus")}</button></div></div>
        <div class="fld"><label>Full name</label><input class="in" id="bn" value="${esc(nm)}" autocomplete="name"></div>
        <div class="fld"><label>WhatsApp number</label><input class="in" id="bp" type="tel" value="${esc(ph)}" placeholder="0977 123 456" autocomplete="tel"></div>
        ${tot > 0 ? `<div class="fld"><label>Pay with mobile money</label><div class="seg">${["MTN", "Airtel", "Zamtel"].map(p => `<button data-p="${p}" class="${p === pay ? "on" : ""}">${p}</button>`).join("")}</div></div>` : ""}
        <div class="tot"><span>Total</span><b>${tot ? money(tot) : "Free"}</b></div>
        <button class="btn b" id="pay">${tot ? "Pay " + money(tot) : "Confirm booking"}</button>
        <p class="hint c">Demo checkout: no real payment is taken.</p>`;

      g("#bn").oninput = x => { nm = x.target.value };
      g("#bp").oninput = x => { ph = x.target.value };

      m.querySelectorAll("[data-ti]").forEach(b => {
        b.onclick = () => {
          ti = +b.dataset.ti;
          qty = Math.max(1, Math.min(qty, e.tiers[ti].qty - e.tiers[ti].sold));
          draw();
        };
      });

      g("#qm").onclick = () => { if (qty > 1) { qty--; draw() } };
      g("#qp").onclick = () => {
        if (qty < Math.min(10, av)) { qty++; draw() }
        else toast(av < 10 ? "Only " + av + " left" : "Maximum 10 tickets per booking");
      };

      m.querySelectorAll("[data-p]").forEach(b => {
        b.onclick = () => { pay = b.dataset.p; draw() };
      });

      g("#pay").onclick = async () => {
        if (nm.trim().length < 2) return toast("Enter your name");
        if (!isValidPhone(ph)) return toast("Enter a valid WhatsApp number");

        const btn = g("#pay");
        btn.disabled = true;
        btn.innerHTML = '<span class="spin"></span>';

        try {
          const { error: be } = await sb.rpc("buy_ticket", { p_event_id: e.id, p_tier_name: t.name, p_qty: qty });
          if (be) { draw(); return toast(be.message) }

          const tk = {
            id: uid("tk_"),
            code: "TZ-" + Math.random().toString(36).slice(2, 10).toUpperCase(),
            event_id: e.id, event_title: e.title, date: e.date, time: e.time, venue: e.venue, city: e.city,
            tier: t.name, price: +t.price, qty, total: tot,
            buyer_name: nm.trim(), buyer_email: me.email || "", buyer_phone: sanitizePhone(ph),
            user_id: me.id, method: tot > 0 ? pay : "", used: false, admitted: 0
          };

          const { error: te } = await sb.from("tickets").insert(tk);
          if (te) { draw(); return toast(te.message) }

          m.close();
          await loadAll();
          if ($("#detail").classList.contains("on")) openEv(e.id);
          showTicket(tk, true);
        } catch (e) {
          btn.disabled = false;
          console.error("Buy error:", e);
          toast("An error occurred");
        }
      };
    };
    draw();
  });
}

function showTicket(t, fresh) {

    `<div class="pass"><div class="pt"><span class="cat">${esc(t.tier)} · ${t.qty} ticket${t.qty > 1 ? "s" : ""}</span><h3>${esc(t.event_title)}</h3>

      <div style="display:flex;gap:8px;padding:0 16px 16px"><button class="btn s b" id="gift">${I("share")}Gift ticket</button></div></div>
    ${fresh ? `<button class="btn b" id="vt">View my tickets</button>` : `<button class="btn s b" data-x>Close</button>`}`);

  const qrDiv = m.querySelector("#qr");
  try {
    if (typeof QRCode !== "undefined") {

  m.querySelector("#gift").onclick = () => giftTicket(t, m);

function giftTicket(t, parent) {

/* ---------- TICKETS ---------- */
function rTix() {
  const box = $("#tl");
  if (!TIX.length) {
    box.innerHTML = `<div class="emp">${I("ticket")}<p>No tickets yet</p><button class="btn" style="margin-top:16px" onclick="go('home')">Browse events</button></div>`;
    return;
  }
  
  // Group tickets by event_title and sort alphabetically
  const grouped = {};
  TIX.forEach(t => {
    const eventTitle = esc(t.event_title || "Unknown Event");
    if (!grouped[eventTitle]) grouped[eventTitle] = [];
    grouped[eventTitle].push(t);
  });
  
  const sortedEvents = Object.keys(grouped).sort();
  
  box.innerHTML = sortedEvents.map(eventTitle => `
    <h2 class="h2" style="margin-top:16px;margin-bottom:12px">${eventTitle}</h2>
    ${grouped[eventTitle].map(t => `<div class="row" data-tk="${esc(t.id)}">
      <div class="th">${I("ticket")}</div>
      <div class="rb"><small>${esc(t.tier)} · ${t.qty} ticket${t.qty > 1 ? "s" : ""}</small><b>${esc(t.event_title)}</b>
      <span>${fdate(t.date)} · ${ftime(t.time)}</span><span>${esc(t.venue)}, ${esc(t.city)}</span>
      <em style="color:var(--ac);font-family:ui-monospace,Menlo,monospace">${esc(t.code)}${t.used ? " ✓ Used" : adm(t) > 0 ? ` · ${adm(t)}/${t.qty} in` : ""}</em></div>
      <button class="btn icon d" title="Delete ticket" onclick="delTix('${esc(t.id)}')">${I("trash")}</button></div>`).join("")}

    const r = e.target.closest("[data-tk]");
    if (r && !e.target.closest("button")) showTicket(TIX.find(x => x.id === r.dataset.tk));
  };
}

async function delTix(id) {
  const t = TIX.find(x => x.id === id);
  if (!t) return;

    await sb.from("tickets").delete().eq("id", id);
    await loadAll();
    rTix();

    console.error("Delete ticket error:", e);

async function checkCode(code, evId) {
  try {
    const { data: t } = await sb.from("tickets").select("*").eq("code", code).maybeSingle();
    if (!t) return { s: "nf" };
    if (t.event_id !== evId) return { s: "wrong", t };
    if (adm(t) >= t.qty) return { s: "used", t };
    return { s: "ok", t };
  } catch (e) {
    console.error("checkCode error:", e);
    return { s: "err", msg: "Could not check ticket" };
  }
}

async function admit(id, n) {
  try {
    const { data: f } = await sb.from("tickets").select("*").eq("id", id).single();
    if (!f) return { err: "Ticket not found" };
    const rem = f.qty - adm(f);
    if (rem <= 0) return { s: "used", t: f };
    n = Math.min(n, rem);
    const a = adm(f) + n;
    const u = { admitted: a, used: a >= f.qty, used_at: new Date().toISOString() };
    const { error } = await sb.from("tickets").update(u).eq("id", id);
    if (error) return { err: error.message };
    return { s: "done", t: { ...f, ...u }, n };
  } catch (e) {
    console.error("admit error:", e);
    return { err: "An error occurred" };
  }
}

const res = (c, h, body, extra = "") => `<div class="res ${c}"><b>${h}</b><span>${body}</span>${extra}</div>`;

async function showRes(el, r, code, after) {
  const t = r.t;
  if (r.s === "nf") return void (el.innerHTML = res("r", "Ticket not found", `No ticket matches ${esc(code)}`));
  if (r.s === "wrong") return void (el.innerHTML = res("r", "Wrong event", `This ticket is for <b style="display:inline">${esc(t.event_title)}</b> on ${fdate(t.date)}`));
  if (r.s === "used") {
    const day = t.used_at && t.used_at.slice(0, 10) !== today() ? fdate(t.used_at.slice(0, 10)) + " at " : "";
    return void (el.innerHTML = res("a", "Already checked in", `${esc(t.buyer_name)} · ${esc(t.tier)} × ${t.qty}<br>All ${t.qty} admitted. Last at ${day}${fts(t.used_at)}`));
  }
  const rem = t.qty - adm(t);
  if (rem === 1) return doAdmit(el, t, 1, after);
  let n = rem;
  const already = adm(t) ? `<br>${adm(t)} of ${t.qty} already in${t.used_at ? " (last at " + fts(t.used_at) + ")" : ""}` : "";
  el.innerHTML = res("g", "Valid ticket",
    `<b style="display:inline">${esc(t.buyer_name)}</b><br>${esc(t.tier)} · ${t.qty} tickets${already}<br>How many are arriving now?`,
    `<div class="qty"><button id="am" aria-label="Fewer">${I("minus")}</button><b id="an">${n}</b><button id="ap" aria-label="More">${I("plus")}</button></div>
     <button class="btn b" id="ago">Admit ${n} of ${rem}</button>`);
  const upd = () => { el.querySelector("#an").textContent = n; el.querySelector("#ago").textContent = `Admit ${n} of ${rem}` };
  el.querySelector("#am").onclick = () => { if (n > 1) { n--; upd() } };
  el.querySelector("#ap").onclick = () => { if (n < rem) { n++; upd() } };
  el.querySelector("#ago").onclick = e => { e.target.disabled = true; doAdmit(el, t, n, after) };
}

async function doAdmit(el, t, n, after) {
  const r = await admit(t.id, n);
  if (r.err) return void (el.innerHTML = res("r", "Could not check in", esc(r.err)));
  if (r.s === "used") return showRes(el, r, t.code, after);
  const f = r.t, remaining = f.qty - adm(f);
  el.innerHTML = res("g", "Checked in ✓",
    `<b style="display:inline">${esc(f.buyer_name)}</b><br>${esc(f.tier)} · admitted ${r.n}${f.qty > 1 ? " of " + f.qty : ""}<br>${remaining ? remaining + " still to arrive (scan again later)" : f.qty > 1 ? "All " + f.qty + " are in" : "Enjoy the event"}`);
  if (navigator.vibrate) navigator.vibrate(60);
  refreshRoster();
  if (after) after(true);
}

async function runTyped(code) {
  code = (code || "").trim().toUpperCase();
  if (!chEv) return toast("Select an event first");
  if (!code) return toast("Enter a ticket code");
  const el = $("#chres");
  el.innerHTML = `<div class="res"><span class="spin" style="display:inline-block"></span></div>`;
  const r = await checkCode(code, chEv);
  showRes(el, r, code, () => { $("#chc").value = "" });
}

async function refreshRoster() {
  if (tab !== "chk" || !$("#chlist")) return;
  if (!chEv) { chRows = []; return void ($("#chlist").innerHTML = "") }
  try {
    const { data } = await sb.from("tickets").select("*").eq("event_id", chEv);
    chRows = data || [];
  } catch (e) {
    console.error("refreshRoster error:", e);
    return;
  }
  drawRoster();
}

function drawRoster() {
  const box = $("#chlist");
  if (!box || !chEv) return;
  const tot = chRows.reduce((s, t) => s + t.qty, 0);
  const inn = chRows.reduce((s, t) => s + adm(t), 0);
  const pct = tot ? Math.round(inn / tot * 100) : 0;
  const rows = chRows
    .filter(t => chFilter === "out" ? adm(t) < t.qty : chFilter === "in" ? adm(t) > 0 : true)
    .sort((a, b) => (a.buyer_name || "").localeCompare(b.buyer_name || ""));
  const F = [["out", "Outstanding"], ["in", "Checked in"], ["all", "All"]];
  box.innerHTML = `
    <div class="cnt"><div><b>${inn}</b> / ${tot}<small>checked in</small></div><span>${tot - inn} to arrive</span></div>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="seg">${F.map(f => `<button data-f="${f[0]}" class="${chFilter === f[0] ? "on" : ""}">${f[1]}</button>`).join("")}</div>
    ${rows.length ? rows.map(t => {
      const a = adm(t);
      return `<div class="chk-tile" data-c="${esc(t.code)}"><div class="chk-tick ${a >= t.qty ? "" : a ? "part" : "off"}">${a >= t.qty ? "✓" : a || "·"}</div>
      <div><b>${esc(t.buyer_name)}</b><br><small>${esc(t.tier)} · ${esc(t.code)}</small></div><span class="rt">${a}/${t.qty}</span></div>`;
    }).join("") : `<p class="hint c">${chRows.length ? "Nobody in this list" : "No tickets sold for this event yet"}</p>`}
    ${rows.length ? `<p class="hint c">Tap a person to check them in by hand.</p>` : ""}`;
}

/* ---- SCANNER (IMPROVED WITH CLEANUP) ---- */
let jsqrP = null, scannerActive = null;
const loadJsQR = () => {
  if (window.jsQR) return Promise.resolve();
  if (jsqrP) return jsqrP;
  jsqrP = new Promise((ok, no) => {
    const sources = [
      "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"
    ];
    let i = 0;
    const tryNext = () => {
      if (i >= sources.length) { jsqrP = null; return no(new Error("All jsQR CDNs failed")) }
      const s = document.createElement("script");
      s.src = sources[i++];
      s.onload = () => window.jsQR ? ok() : tryNext();
      s.onerror = tryNext;
      document.head.appendChild(s);
    };
    tryNext();
  });
  return jsqrP;
};

const stopScanner = () => {
  if (scannerActive) {
    try { scannerActive() } catch (e) { console.warn("stopScanner error:", e) }
    scannerActive = null;
  }
};

async function openScan() {
  if (!chEv) return toast("Select an event first");
  if (scannerActive) return;
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) return toast("Camera needs HTTPS or localhost. Type the code instead.");

  const IDLE = "Tap Start to turn on the camera", LIVE = "Point the camera at the ticket QR code";
  const o = document.createElement("div");
  o.className = "scn";
  o.innerHTML = `<video playsinline muted autoplay></video><canvas hidden></canvas><div class="frame"></div>
    <div class="scs">${IDLE}</div><button class="btn scgo" id="sgo">Start</button>
    <button class="xb scx" aria-label="Close">${I("x")}</button>
    <div class="scr"><div id="sres"></div><button class="btn s b" id="sn">Scan next</button></div>`;
  document.body.appendChild(o);

  const v = o.querySelector("video"), cv = o.querySelector("canvas");
  const cx = cv.getContext("2d", { willReadFrequently: true });
  const panel = o.querySelector(".scr"), out = o.querySelector("#sres"), hint = o.querySelector(".scs"), go = o.querySelector("#sgo");
  let stream = null, det = null, ready = false, run = true, active = false, starting = false;
  let token = 0, paused = false, last = "", lastT = 0;

  const setBtn = (label, stop) => { go.textContent = label; go.classList.toggle("stop", !!stop); go.disabled = false };
  const setHint = (msg, wide) => { hint.textContent = msg; hint.style.right = wide ? "20px" : "70px" };

  const stop = () => {
    active = false; starting = false; token++; paused = false;
    if (stream) { stream.getTracks().forEach(t => { try { t.stop() } catch { } }); stream = null }
    v.srcObject = null;
    panel.classList.remove("on");
    setBtn("Start", false);
  };

  const close = () => {
    if (!run) return;
    run = false;
    stop();
    try { o.remove() } catch { }
    scannerActive = null;
    refreshRoster();
  };

  scannerActive = close;
  o.querySelector(".scx").onclick = close;

  const resume = () => { panel.classList.remove("on"); paused = false; lastT = Date.now() };
  o.querySelector("#sn").onclick = resume;

  const grab = scale => {
    if (!window.jsQR || !v.videoWidth) return null;
    const w = Math.round(v.videoWidth * scale), h = Math.round(v.videoHeight * scale);
    cv.width = w;
    cv.height = h;
    try {
      cx.drawImage(v, 0, 0, w, h);
      return cx.getImageData(0, 0, w, h);
    } catch (e) {
      console.warn("Canvas draw error:", e);
      return null;
    }
  };

  const decodeWithJsQR = () => {
    if (!window.jsQR || !v.videoWidth) return "";
    for (const scale of [1, 0.5, 1.5]) {
      const img = grab(scale);
      if (!img) continue;
      try {
        const q = jsQR(img.data, img.width, img.height, { inversionAttempts: "attemptBoth" });
        if (q && q.data) return q.data;
      } catch (e) {
        console.warn("jsQR decode error:", e);
      }
    }
    return "";
  };

  const read = async () => {
    if (det) {
      try {
        const b = await det.detect(v);
        if (b && b[0] && b[0].rawValue) return b[0].rawValue;
      } catch (e) {
        console.warn("BarcodeDetector failed:", e);
        det = null;
        try { await loadJsQR() } catch { }
      }
      if (!window.jsQR) return "";
    }
    return decodeWithJsQR();
  };

  const handle = async code => {
    paused = true;
    last = code;
    lastT = Date.now();
    if (navigator.vibrate) navigator.vibrate(30);
    out.innerHTML = `<div class="res"><span class="spin" style="display:inline-block"></span></div>`;
    panel.classList.add("on");
    const r = await checkCode(code, chEv);
    showRes(out, r, code, () => setTimeout(() => { if (run && active && paused) resume() }, 1800));
  };

  const loop = async my => {
    if (!run || !active || my !== token) return;
    if (!paused && v.readyState >= 2 && v.videoWidth) {
      let val = "";
      try { val = (await read()).trim().toUpperCase() } catch (e) { console.warn("Read error:", e) }
      if (my !== token) return;
      const m = val.match(/TZ-[A-Z0-9]{8}/);
      if (m) val = m[0];
      if (val && !(val === last && Date.now() - lastT < 3000)) handle(val);
    }
    setTimeout(() => loop(my), 120);
  };

  const start = async () => {
    if (active || starting || !run) return;
    starting = true; go.disabled = true; go.textContent = "Starting…";
    let s;
    try {
      s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
    } catch (err) {
      console.error("getUserMedia failed:", err?.name, err?.message);
      starting = false; setBtn("Start", false);
      setHint(
        err?.name === "NotAllowedError" ? "Camera permission was denied. Allow camera access in your browser settings, then tap Start, or type the ticket code instead." :
        err?.name === "NotFoundError" ? "No camera was found on this device. Type the ticket code instead." :
        err?.name === "NotReadableError" ? "The camera is in use by another app. Close it and tap Start, or type the ticket code instead." :
        err?.name === "OverconstrainedError" ? "This camera doesn't support the requested mode. Type the ticket code instead." :
        "Could not open the camera. Tap Start to retry, or type the ticket code instead.", true);
      return;
    }
    if (!run) { s.getTracks().forEach(t => { try { t.stop() } catch { } }); return }
    stream = s; v.srcObject = s;
    try { await v.play() } catch (e) { console.warn("Video play error:", e) }
    try {
      const tr = s.getVideoTracks()[0], caps = tr.getCapabilities ? tr.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.includes("continuous")) await tr.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
    } catch (e) { console.warn("Constraint error:", e) }

    if (!ready) {
      try {
        if ("BarcodeDetector" in window && (await BarcodeDetector.getSupportedFormats()).includes("qr_code")) det = new BarcodeDetector({ formats: ["qr_code"] });
      } catch (e) { console.warn("BarcodeDetector init error:", e) }
      if (!det) {
        try { await loadJsQR() } catch (e) {
          console.error("jsQR failed to load:", e);
          stop();
          setHint("QR reader unavailable. Check your connection and tap Start, or type the ticket code instead.", true);
          return;
        }
      }
      ready = true;
    }
    if (!run || !stream) return;
    starting = false; active = true; paused = false; last = ""; lastT = 0;
    setHint(LIVE, false); setBtn("Stop", true);
    loop(++token);
  };

  go.onclick = () => { if (active || starting) { stop(); setHint(IDLE, false) } else start() };
}

  } catch (e) {
    console.error("del error:", e);
    toast("Could not delete event");
  }
}

function openEditor(id) {
  needAuth(async () => {
    if (!isOrg()) return toast("Only organiser accounts can create events");
    const e = id ? MINE.find(x => x.id === id) : null;
    if (id && !e) return toast("Event not found");
    const D = e
      ? { title: e.title, category: e.category, city: e.city, venue: e.venue, date: e.date, time: e.time, desc: e.description || "", tagline: e.tagline || "", featured: !!e.featured }
      : { title: "", category: "", city: "", venue: "", date: "", time: "", desc: "", tagline: "", featured: false };
    const T = e ? e.tiers.map(t => ({ ...t })) : [{ name: "General Admission", price: "", qty: "", sold: 0 }];
    const PR = e ? (e.presenters || []).map(x => ({ ...x })) : [];
    let img = e ? e.img || "" : "";
    const m = sheet(""), g = s => m.querySelector(s);

    const draw = () => {
      g(".sh").innerHTML = `<div class="grab"></div>` + sh(e ? "Edit event" : "New event") + `
        <div class="fld"><label>Event name</label><input class="in" data-k="title" value="${esc(D.title)}" placeholder="e.g. Lusaka Comedy Night"></div>
        <div class="two">
          <div class="fld"><label>Category</label><select class="in" data-k="category"><option value="">Select</option>${CATS.map(c => `<option ${c === D.category ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
          <div class="fld"><label>City</label><input class="in" data-k="city" list="citylist" value="${esc(D.city)}" placeholder="Lusaka"><datalist id="citylist">${CITIES.map(c => `<option>${c}</option>`).join("")}</datalist></div>
        </div>
        <div class="fld"><label>Venue</label><input class="in" data-k="venue" value="${esc(D.venue)}" placeholder="e.g. Mulungushi Conference Centre"></div>
        <div class="two">
          <div class="fld"><label>Date</label><input class="in" type="date" data-k="date" value="${D.date}" ${e ? "" : `min="${today()}"`}></div>
          <div class="fld"><label>Start time</label><input class="in" type="time" data-k="time" value="${D.time}"></div>
        </div>
        <div class="fld"><label>Short summary (shown under About)</label><input class="in" data-k="tagline" value="${esc(D.tagline)}" placeholder="One line that sells the event"></div>
        <div class="fld"><label>Full description</label><textarea class="in" data-k="desc" placeholder="Tell people what to expect">${esc(D.desc)}</textarea></div>
        <div class="fld"><label>Banner image</label><div class="upload"><input type="file" accept="image/*" id="fi">${img ? `<img src="${img}" alt="" loading="lazy">` : `<div>${I("img")}<br>Tap to upload a banner</div>`}</div></div>
        <h2 class="h2" style="margin-top:8px">Presenters</h2>
        <p class="sub">People performing or speaking. Add a photo and name for each.</p>
        ${PR.map((x, i) => `<div class="pr">
          <label class="pth"><input type="file" accept="image/*" data-pi="${i}">${x.img ? `<img src="${x.img}" alt="">` : I("user")}</label>
          <div class="pf"><input class="in" data-p="${i}" data-f="name" placeholder="Name" value="${esc(x.name)}"><input class="in" data-p="${i}" data-f="role" placeholder="Role (e.g. Headliner)" value="${esc(x.role || "")}"></div>
          <button class="btn d sm" data-pr="${i}" aria-label="Remove presenter">${I("trash")}</button></div>`).join("")}
        <button class="btn s b" id="ap" style="margin-bottom:8px">${I("plus")}Add presenter</button>
        <label class="chk"><input type="checkbox" data-k="featured" ${D.featured ? "checked" : ""}>Feature on the Explore tab</label>
        <h2 class="h2" style="margin-top:8px">Tickets</h2>
        <p class="sub">Use 0 for free tickets. A ${fee}% platform fee applies.</p>
        ${T.map((t, i) => `<div class="trow">
          <input class="in n" data-t="${i}" data-f="name" placeholder="Name" value="${esc(t.name)}">
          <input class="in p" type="number" inputmode="numeric" min="0" data-t="${i}" data-f="price" placeholder="Price" value="${t.price}">
          <input class="in q" type="number" inputmode="numeric" min="1" data-t="${i}" data-f="qty" placeholder="Qty" value="${t.qty}">
          <button class="btn d sm" data-rm="${i}" ${T.length === 1 || t.sold > 0 ? "disabled" : ""} aria-label="Remove ticket type">${I("trash")}</button></div>`).join("")}
        <button class="btn s b" id="at" style="margin-bottom:14px">${I("plus")}Add ticket type</button>
        <button class="btn b" id="sv">${e ? "Save changes" : "Publish event"}</button>`;

      m.querySelectorAll("[data-k]").forEach(i => {
        const h = () => D[i.dataset.k] = i.type === "checkbox" ? i.checked : i.value;
        i.oninput = h;
        i.onchange = h;
      });
      m.querySelectorAll("[data-t]").forEach(i => i.oninput = () => T[i.dataset.t][i.dataset.f] = i.value);
      m.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { T.splice(+b.dataset.rm, 1); draw() });
      g("#at").onclick = () => { T.push({ name: "", price: "", qty: "", sold: 0 }); draw() };
      m.querySelectorAll("[data-p]").forEach(i => i.oninput = () => PR[i.dataset.p][i.dataset.f] = i.value);
      m.querySelectorAll("[data-pr]").forEach(b => b.onclick = () => { PR.splice(+b.dataset.pr, 1); draw() });
      m.querySelectorAll("[data-pi]").forEach(i => i.onchange = () => shrink(i.files[0], 400, u => { PR[i.dataset.pi].img = u; draw() }));
      g("#ap").onclick = () => { PR.push({ name: "", role: "", img: "" }); draw() };
      g("#fi").onchange = pick;
      g("#sv").onclick = save;
    };

    function pick(ev) {
      const f = ev.target.files[0];
      if (!f) return;
      if (!f.type.startsWith("image/")) return toast("Choose an image file");
      shrink(f, 900, u => { img = u; draw() });
    }

    async function save() {
      for (const k of ["title", "category", "city", "venue", "date", "time"])
        if (!String(D[k]).trim()) return toast("Please fill in all event details");
      if (!e && D.date < today()) return toast("Pick a date today or later");
      for (const t of T) {
        if (!String(t.name).trim()) return toast("Every ticket type needs a name");
        if (t.price === "" || +t.price < 0) return toast("Enter a valid price");
        if (t.qty === "" || +t.qty < 1) return toast("Enter a quantity");
        if (+t.qty < (t.sold || 0)) return toast(`"${t.name}" already has ${t.sold} sold`);
      }
      const btn = g("#sv");
      btn.disabled = true;
      try {
        const ev = {
          id: e ? e.id : uid("ev_"),
          owner: me.id,
          owner_name: me.name,
          title: D.title.trim(),
          category: D.category,
          city: D.city.trim(),
          venue: D.venue.trim(),
          date: D.date,
          time: D.time,
          description: D.desc.trim(),
          img,
          tiers: T.map(t => ({ name: t.name.trim(), price: +t.price || 0, qty: +t.qty, sold: t.sold || 0 })),
          featured: D.featured,
          tagline: D.tagline.trim(),
          presenters: PR.filter(x => String(x.name).trim()).map(x => ({ name: x.name.trim(), role: (x.role || "").trim(), img: x.img || "" })),
          status: "live"
        };
        const { error } = await (e ? sb.from("events").update(ev).eq("id", ev.id) : sb.from("events").insert(ev));
        if (error) { btn.disabled = false; return toast(error.message) }
        m.close();
        toast(e ? "Event updated" : "Event published");
        await loadAll();
        rOrg();
        rHome();
      } catch (err) {
        btn.disabled = false;
        console.error("save error:", err);
        toast("An error occurred");
      }
    }
    draw();
  });
}

/* ---------- ACCOUNT ---------- */
function rMe() {
  $("#ml").innerHTML = me
    ? `<div class="me"><div class="av">${esc((me.name || "U")[0].toUpperCase())}</div>
        <h2>${esc(me.name || "")}</h2>
        <p style="color:var(--t2);margin:6px 0 20px;font-size:.9rem">${esc(me.email || "")}${me.phone ? "<br>" + esc(me.phone) : ""}</p></div>
       <div class="grp">
         <div class="gi">${I("ticket")}<span>Tickets booked</span><span class="sp">${TIX.length}</span></div>
         ${isOrg() ? `<div class="gi">${I("grid")}<span>Events created</span><span class="sp">${MINE.length}</span></div>` : ""}
         <div class="gi">${I("user")}<span>Account type</span><span class="sp">${me.role === "organiser" ? "Organiser" : me.role === "admin" ? "Admin" : "Customer"}</span></div>
       </div>
       ${isOrg() ? "" : `<p class="hint c">Want to sell tickets? Create a separate organiser account.</p>`}
       <button class="btn d b" style="margin-top:20px" id="so">Sign out</button>`
    : `<div class="emp">${I("user")}<p>Sign in to book tickets and manage events.</p>
       <button class="btn" style="margin-top:16px" onclick="openAuth()">Sign in or create account</button></div>`;

  if (USE_LOCAL) {
    $("#ml").insertAdjacentHTML("beforeend",
      `<button class="btn s b" id="rs" style="margin-top:12px">Reset local demo data</button>
       <p class="hint c">Local mode: accounts, events and tickets are saved in this browser only.</p>`);
    $("#rs").onclick = async () => {
      if (await ask("Reset demo data?", "This clears all local accounts, events and tickets.", "Reset", "d")) {
        Object.keys(localStorage).filter(k => k.startsWith("tz_")).forEach(k => localStorage.removeItem(k));
        location.reload();
      }
    };
  }
  const b = $("#so");
  if (b) b.onclick = async () => {
    if (await ask("Sign out?", "You can sign back in any time.", "Sign out", "d")) {
      try { await sb.auth.signOut() } catch { }
      me = null;
      MINE = [];
      TIX = [];
      closeEv();
      go("home");
      toast("Signed out");
    }
  };
}

/* ---------- INIT ---------- */
loadSaved();
updateFbtn();
$("#list").innerHTML = `<div class="sk">${skeleton(5)}</div>`;
(async () => {
  try {
    await loadMe();
    await loadAll();
    go("home");
    sb.auth.onAuthStateChange(async () => {
      try {
        await loadMe();
        await loadAll();
        if (tab === "home") rHome();
      } catch (e) {
        console.error("Auth state change error:", e);
      }
    });
  } catch (e) {
    console.error("Init error:", e);
    toast("Failed to load app");
  }
})();
</script>
