function localSb() {

    wr("events", ev); wr("seeded", 2);

  function from(table) {

    const b = {
      select() { return b }, eq(c, v) { fl.push(r => r[c] === v); return b }, neq(c, v) { fl.push(r => r[c] !== v); return b },
      order(c, o) { ord = [c, o && o.ascending === false]; return b }, single() { one = "single"; return b }, maybeSingle() { one = "maybe"; return b },
      insert(p) { op = "insert"; pl = p; return b }, update(p) { op = "update"; pl = p; return b }, upsert(p) { op = "upsert"; pl = p; return b }, delete() { op = "delete"; return b },
      then(res, rej) { return Promise.resolve(run()).then(res, rej) }
    };
    function run() {
      if (table === "events") seed();
      let rows = table === "settings" ? [{ id: 1, fee: 5 }] : rd(table, []);
      const hit = r => fl.every(f => f(r));
      if (op === "insert") { const add = [].concat(pl).map(r => ({ ...r, created_at: now() })); wr(table, [...rows, ...add]); return { data: add, error: null } }
      if (op === "upsert") { const i = rows.findIndex(r => r.id === pl.id); if (i >= 0) rows[i] = { ...rows[i], ...pl }; else rows.push({ ...pl, created_at: now() }); wr(table, rows); return { data: [pl], error: null } }
      if (op === "update") { wr(table, rows.map(r => hit(r) ? { ...r, ...pl } : r)); return { data: null, error: null } }
      if (op === "delete") { wr(table, rows.filter(r => !hit(r))); return { data: null, error: null } }
      const out = rows.filter(hit);
      if (ord) out.sort((x, y) => (x[ord[0]] > y[ord[0]] ? 1 : -1) * (ord[1] ? -1 : 1));
      if (one) return out.length ? { data: out[0], error: null } : { data: null, error: one === "single" ? { message: "Not found" } : null };
      return { data: out, error: null };
    }
    return b;
  }

    from,

function rHome() {
  const ql = q.toLowerCase().trim(), filt = ql || cat || city || dateF || priceF;
  let l = ALL.filter(e => {
    if (ql && ![e.title, e.city, e.venue, e.category].some(x => (x || "").toLowerCase().includes(ql))) return false;
    if (cat && e.category !== cat) return false;
    if (city && e.city !== city) return false;
    if (dateF) {
      const ed = e.date;
      if (dateF === "Today" && ed !== tdy()) return false;
      if (dateF === "This weekend") {
        const d = new Date(); const day = d.getDay();
        let fri, sun; if (day === 0) { fri = new Date(d); fri.setDate(fri.getDate() - 2); sun = d; } else if (day === 6) { fri = new Date(d); fri.setDate(fri.getDate() - 1); sun = new Date(d); sun.setDate(sun.getDate() + 1); } else { fri = new Date(d); fri.setDate(fri.getDate() + (5 - day)); sun = new Date(fri); sun.setDate(sun.getDate() + 2); }
        const fs = fri.toISOString().slice(0, 10), ss = sun.toISOString().slice(0, 10); if (!(ed >= fs && ed <= ss)) return false;
      }
      if (dateF === "Next week") {
        const d = new Date(); const mon = new Date(d); mon.setDate(mon.getDate() + (1 + 7 - mon.getDay())); const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
        const ms = mon.toISOString().slice(0, 10), ss = sun.toISOString().slice(0, 10); if (!(ed >= ms && ed <= ss)) return false;
      }
    }
    if (priceF) {
      const p = minP(e);
      if (priceF === "Free" && p !== 0) return false;
      if (priceF === "ZMW 1-100" && (p <= 0 || p > 100)) return false;
      if (priceF === "ZMW 100+" && p <= 100) return false;
    }
    return true;
  }).sort((a, b) => ended(a) - ended(b) || a.date.localeCompare(b.date));

}

/* presenter slideshow */
function initPS() {
  clearInterval(psT);
  const t = document.querySelector(".pst"); if (!t) return;
  const sl = [...t.children], dots = [...document.querySelectorAll(".dots i")];
  const act = () => { const c = t.scrollLeft + t.clientWidth / 2; let bi = 0, bd = 1e9; sl.forEach((x, i) => { const d = Math.abs(x.offsetLeft + x.offsetWidth / 2 - c); if (d < bd) { bd = d; bi = i } }); sl.forEach((x, i) => { x.classList.toggle("on", i === bi); dots[i].classList.toggle("on", i === bi) }); return bi };
  const to = i => t.scrollTo({ left: sl[i].offsetLeft + sl[i].offsetWidth / 2 - t.clientWidth / 2, behavior: "smooth" });
  const play = () => { clearInterval(psT); if (sl.length > 1) psT = setInterval(() => to((act() + 1) % sl.length), 3800) };
  t.addEventListener("scroll", act, { passive: true });
  sl.forEach((x, i) => x.onclick = () => to(i)); dots.forEach((d, i) => d.onclick = () => to(i));
  ["pointerdown", "touchstart", "wheel"].forEach(ev => t.addEventListener(ev, () => clearInterval(psT), { passive: true }));
  ["pointerup", "touchend"].forEach(ev => t.addEventListener(ev, () => { clearInterval(psT); psT = setTimeout(play, 6000) }, { passive: true }));
  act(); play();
}

/* A ticket can cover several people (qty). "admitted" counts how many have come in so far.
   Older tickets that only have used=true are treated as fully admitted. */
const adm = t => t.admitted ?? (t.used ? t.qty : 0);
const fts = s => s ? new Date(s).toLocaleTimeString("en-ZM", { hour: "numeric", minute: "2-digit" }) : "";

/* look up a code and compare it with the selected event */
async function checkCode(code, evId) {
  const { data: t } = await sb.from("tickets").select("*").eq("code", code).maybeSingle();
  if (!t) return { s: "nf" };
  if (t.event_id !== evId) return { s: "wrong", t };
  if (adm(t) >= t.qty) return { s: "used", t };
  return { s: "ok", t };
}

/* admit n people on a ticket (re-reads the ticket first so two gates can't double-admit) */
async function admit(id, n) {
  const { data: f } = await sb.from("tickets").select("*").eq("id", id).single();
  if (!f) return { err: "Ticket not found" };
  const rem = f.qty - adm(f);
  if (rem <= 0) return { s: "used", t: f };
  n = Math.min(n, rem);
  const a = adm(f) + n, u = { admitted: a, used: a >= f.qty, used_at: new Date().toISOString() };
  const { error } = await sb.from("tickets").update(u).eq("id", id);
  if (error) return { err: error.message };
  return { s: "done", t: { ...f, ...u }, n };
}

const res = (c, h, body, extra = "") => `<div class="res ${c}"><b>${h}</b><span>${body}</span>${extra}</div>`;

/* draw the result of a check into el. after(true) is called once someone has been admitted */
async function showRes(el, r, code, after) {
  const t = r.t;
  if (r.s === "nf") return void (el.innerHTML = res("r", "Ticket not found", `No ticket matches ${esc(code)}`));
  if (r.s === "wrong") return void (el.innerHTML = res("r", "Wrong event", `This ticket is for <b style="display:inline">${esc(t.event_title)}</b> on ${fdate(t.date)}`));
  if (r.s === "used") {
    const day = t.used_at && t.used_at.slice(0, 10) !== today() ? fdate(t.used_at.slice(0, 10)) + " at " : "";
    return void (el.innerHTML = res("a", "Already checked in", `${esc(t.buyer_name)} · ${esc(t.tier)} × ${t.qty}<br>All ${t.qty} admitted. Last at ${day}${fts(t.used_at)}`));
  }
  const rem = t.qty - adm(t);
  if (rem === 1) return doAdmit(el, t, 1, after);          // single person left: admit straight away
  let n = rem;
  const already = adm(t) ? `<br>${adm(t)} of ${t.qty} already in${t.used_at ? " (last at " + fts(t.used_at) + ")" : ""}` : "";
  el.innerHTML = res("g", "Valid ticket", `<b style="display:inline">${esc(t.buyer_name)}</b><br>${esc(t.tier)} · ${t.qty} tickets${already}<br>How many are arriving now?`,
    `<div class="qty"><button id="am" aria-label="Fewer">${I("minus")}</button><b id="an">${n}</b><button id="ap" aria-label="More">${I("plus")}</button></div><button class="btn b" id="ago">Admit ${n} of ${rem}</button>`);
  const upd = () => { el.querySelector("#an").textContent = n; el.querySelector("#ago").textContent = `Admit ${n} of ${rem}` };
  el.querySelector("#am").onclick = () => { if (n > 1) { n--; upd() } };
  el.querySelector("#ap").onclick = () => { if (n < rem) { n++; upd() } };
  el.querySelector("#ago").onclick = e => { e.target.disabled = true; doAdmit(el, t, n, after) };
}

async function doAdmit(el, t, n, after) {
  const r = await admit(t.id, n);
  if (r.err) return void (el.innerHTML = res("r", "Could not check in", esc(r.err)));
  if (r.s === "used") return showRes(el, r, t.code, after);
  const f = r.t, left = f.qty - adm(f);
  el.innerHTML = res("g", "Checked in ✓", `<b style="display:inline">${esc(f.buyer_name)}</b><br>${esc(f.tier)} · admitted ${r.n}${f.qty > 1 ? " of " + f.qty : ""}<br>${left ? left + " still to arrive (scan again later)" : f.qty > 1 ? "All " + f.qty + " are in" : "Enjoy the event"}`);
  navigator.vibrate && navigator.vibrate(60);
  refreshRoster(); if (after) after(true);
}

async function runTyped(code) {
  code = (code || "").trim().toUpperCase();
  if (!chEv) return toast("Select an event first");
  if (!code) return toast("Enter a ticket code");
  const el = $("#chres"); el.innerHTML = `<div class="res"><span class="spin" style="display:inline-block"></span></div>`;
  const r = await checkCode(code, chEv);
  showRes(el, r, code, () => { $("#chc").value = "" });
}

/* ---- roster + live counter ---- */
async function refreshRoster() {
  if (tab !== "chk" || !$("#chlist")) return;
  if (!chEv) { chRows = []; return void ($("#chlist").innerHTML = "") }
  const { data } = await sb.from("tickets").select("*").eq("event_id", chEv);
  chRows = data || []; drawRoster();
}
function drawRoster() {
  const box = $("#chlist"); if (!box || !chEv) return;
  const tot = chRows.reduce((s, t) => s + t.qty, 0), inn = chRows.reduce((s, t) => s + adm(t), 0), pct = tot ? Math.round(inn / tot * 100) : 0;
  const rows = chRows.filter(t => chFilter === "out" ? adm(t) < t.qty : chFilter === "in" ? adm(t) > 0 : true).sort((a, b) => (a.buyer_name || "").localeCompare(b.buyer_name || ""));
  const F = [["out", "Outstanding"], ["in", "Checked in"], ["all", "All"]];
  box.innerHTML = `<div class="cnt"><div><b>${inn}</b> / ${tot}<small>checked in</small></div><span>${tot - inn} to arrive</span></div><div class="pbar"><i style="width:${pct}%"></i></div>
  <div class="seg">${F.map(f => `<button data-f="${f[0]}" class="${chFilter === f[0] ? "on" : ""}">${f[1]}</button>`).join("")}</div>
  ${rows.length ? rows.map(t => { const a = adm(t); return `<div class="chk-tile" data-c="${esc(t.code)}"><div class="chk-tick ${a >= t.qty ? "" : a ? "part" : "off"}">${a >= t.qty ? "✓" : a ? a : "·"}</div><div><b>${esc(t.buyer_name)}</b><br><small>${esc(t.tier)} · ${esc(t.code)}</small></div><span class="rt">${a}/${t.qty}</span></div>` }).join("") : `<p class="hint c">${chRows.length ? "Nobody in this list" : "No tickets sold for this event yet"}</p>`}
  <p class="hint c">Tap a person to check them in by hand.</p>`;
}

/* ---- camera scanner ---- */
let jsqrP = null;
const loadJsQR = () => window.jsQR ? Promise.resolve() : jsqrP || (jsqrP = new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"; s.onload = ok; s.onerror = () => { jsqrP = null; no() }; document.head.appendChild(s) }));

async function openScan() {
  if (!chEv) return toast("Select an event first");
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) return toast("Camera needs HTTPS or localhost. Type the code instead.");
  const o = document.createElement("div"); o.className = "scn";
  o.innerHTML = `<video playsinline muted></video><canvas hidden></canvas><div class="frame"></div><div class="scs">Point the camera at the ticket QR code</div><button class="xb scx" aria-label="Close">${I("x")}</button><div class="scr"><div id="sres"></div><button class="btn s b" id="sn">Scan next</button></div>`;
  document.body.appendChild(o);
  const v = o.querySelector("video"), cv = o.querySelector("canvas"), cx = cv.getContext("2d", { willReadFrequently: true }), panel = o.querySelector(".scr"), out = o.querySelector("#sres");
  let stream, det, run = true, paused = false, last = "", lastT = 0;
  const close = () => { run = false; stream && stream.getTracks().forEach(t => t.stop()); o.remove(); refreshRoster() };
  o.querySelector(".scx").onclick = close;
  const resume = () => { panel.classList.remove("on"); paused = false; lastT = Date.now() };
  o.querySelector("#sn").onclick = resume;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false }); v.srcObject = stream; await v.play() }
  catch { close(); return toast("Camera blocked. Allow camera access, or type the code.") }
  if ("BarcodeDetector" in window) { try { det = new BarcodeDetector({ formats: ["qr_code"] }) } catch { } }
  if (!det) { try { await loadJsQR() } catch { close(); return toast("Could not load the QR reader. Type the code instead.") } }
  const handle = async code => {
    paused = true; last = code; navigator.vibrate && navigator.vibrate(30);
    out.innerHTML = `<div class="res"><span class="spin" style="display:inline-block"></span></div>`; panel.classList.add("on");
    const r = await checkCode(code, chEv);
    showRes(out, r, code, () => setTimeout(() => { if (run && paused) resume() }, 1800));  // auto-continue after a successful admit
  };
  const tick = async () => {
    if (!run) return;
    if (!paused && v.readyState >= 2) {
      let val = "";
      try {
        if (det) { const b = await det.detect(v); val = b[0]?.rawValue || "" }
        else { const k = Math.min(1, 640 / v.videoWidth); cv.width = v.videoWidth * k; cv.height = v.videoHeight * k; cx.drawImage(v, 0, 0, cv.width, cv.height); const d = cx.getImageData(0, 0, cv.width, cv.height), q = jsQR(d.data, d.width, d.height, { inversionAttempts: "dontInvert" }); val = q ? q.data : "" }
      } catch { }
      val = val.trim().toUpperCase();
      if (val && !(val === last && Date.now() - lastT < 3000)) handle(val);
    }
    setTimeout(tick, 150);
  };
  tick();
}
function updateCheckList(eventId) {
  if (!eventId) { $("#chlist").innerHTML = ""; return; }
  const { data: tix } = sb.from("tickets").select("*").eq("event_id", eventId).then(r => r);
  tix.then(tickets => {
    const checked = (tickets || []).filter(t => t.used).length;
    $("#chlist").innerHTML = `<h2 class="h2">Checked in (${checked})</h2>${(tickets || []).filter(t => t.used).map(t => `<div class="chk-tile"><div class="chk-tick">✓</div><div><b>${esc(t.buyer_name)}</b><br><small>${esc(t.code)}</small></div></div>`).join("")}`;
  });
}

/* ---------- ORGANISER ---------- */
function rOrg() {
  const sold = MINE.reduce((s, e) => s + (e.tiers || []).reduce((a, t) => a + t.sold, 0), 0);
  const gross = MINE.reduce((s, e) => s + (e.tiers || []).reduce((a, t) => a + t.sold * t.price, 0), 0);
  const yourShare = Math.round(gross * (1 - fee / 100));
  
  $("#ol").innerHTML = `<div class="kpis"><div class="kpi"><small>Events</small><b>${MINE.length}</b></div><div class="kpi"><small>Tickets sold</small><b>${sold}</b></div><div class="kpi"><small>Gross sales</small><b>${money(gross)}</b></div><div class="kpi"><small>Your ${100 - fee}% share</small><b>${money(yourShare)}</b></div></div>
  <h2 class="h2">Sales breakdown</h2>
  <div class="grp"><div class="gi"><span>Gross revenue</span><span class="sp">${money(gross)}</span></div><div class="gi"><span>Platform fee (${fee}%)</span><span class="sp" style="color:var(--t2)">-${money(Math.round(gross * fee / 100))}</span></div><div class="gi"><span><b>Your payout</b></span><span class="sp" style="color:var(--ac);font-weight:700">${money(yourShare)}</span></div></div>
  <button class="btn b" style="margin:12px 0 4px" onclick="openEditor()">${I("plus")}New event</button>
  ${MINE.length ? MINE.map(e => { const s = (e.tiers || []).reduce((a, t) => a + t.sold, 0), n = (e.tiers || []).reduce((a, t) => a + t.qty, 0), rev = (e.tiers || []).reduce((a, t) => a + t.sold * t.price, 0); return `<div class="row" style="flex-direction:column;gap:0;cursor:default"><div style="display:flex;gap:14px" onclick="closeEv();openEv('${e.id}')" style="cursor:pointer"><div class="th" style="width:64px;height:64px">${e.img ? `<img src="${e.img}" alt="">` : I("ticket")}</div><div class="rb"><b>${esc(e.title)}</b><span>${fdate(e.date)}${ended(e) ? " · Ended" : ""}</span><span>${s} / ${n} sold · ${money(rev)}</span></div></div>
    <div class="acts"><button class="btn s sm" onclick="sales('${e.id}')">${I("users")}Attendees</button><button class="btn s sm" onclick="openEditor('${e.id}')">${I("edit")}Edit</button><button class="btn d sm" onclick="del('${e.id}')">${I("trash")}</button></div></div>` }).join("") : `<div class="emp">${I("grid")}<p>No events yet. Create your first one.</p></div>`}`;
}
async function sales(id) {
  const e = MINE.find(x => x.id === id);
  const { data: l } = await sb.from("tickets").select("*").eq("event_id", id).order("created_at", { ascending: false });
  sheet(sh("Attendees", esc(e.title)) + `<div class="grp">${(e.tiers || []).map(t => `<div class="gi"><span>${esc(t.name)}</span><span class="sp">${t.sold} / ${t.qty}</span></div>`).join("")}</div><h2 class="h2">Bookings</h2>
  ${(l || []).length ? `<div class="grp">${l.map(t => `<div class="gi"><span>${esc(t.buyer_name)}<small>${esc(t.buyer_email)} · ${esc(t.buyer_phone)}</small></span><span class="sp">${t.qty} × ${esc(t.tier)}<small>${esc(t.code)}${t.used ? " ✓" : ""}</small></span></div>`).join("")}</div>` : `<p class="hint">No bookings yet.</p>`}`);
}
async function del(id) {
  const e = MINE.find(x => x.id === id);
  if (!await ask("Delete this event?", `<b>${esc(e.title)}</b> will be removed permanently.`, "Delete event", "d")) return;
  const { error } = await sb.from("events").delete().eq("id", id);
  if (error) return toast(error.message);
  toast("Event deleted"); await loadAll(); rOrg(); rHome();
}

function openEditor(id) {
  needAuth(async () => {
    if (!isOrg()) return toast("Only organiser accounts can create events");
    const e = id && MINE.find(x => x.id === id);
    const D = e ? { title: e.title, category: e.category, city: e.city, venue: e.venue, date: e.date, time: e.time, desc: e.description || "", tagline: e.tagline || "", featured: !!e.featured } : { title: "", category: "", city: "", venue: "", date: "", time: "", desc: "", tagline: "", featured: false };
    const T = e ? e.tiers.map(t => ({ ...t })) : [{ name: "General Admission", price: "", qty: "", sold: 0 }];
    const PR = e ? (e.presenters || []).map(x => ({ ...x })) : [];
    let img = e ? e.img || "" : ""; const m = sheet(""), g = s => m.querySelector(s);
    const draw = () => {
      g(".sh").innerHTML = `<div class="grab"></div>` + sh(e ? "Edit event" : "New event") +
        `<div class="fld"><label>Event name</label><input class="in" data-k="title" value="${esc(D.title)}" placeholder="e.g. Lusaka Comedy Night"></div>
        <div class="two"><div class="fld"><label>Category</label><select class="in" data-k="category"><option value="">Select</option>${CATS.map(c => `<option ${c === D.category ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
        <div class="fld"><label>City</label><input class="in" data-k="city" list="cl" value="${esc(D.city)}" placeholder="Lusaka"><datalist id="cl">${CITIES.map(c => `<option>${c}</option>`).join("")}</datalist></div></div>
        <div class="fld"><label>Venue</label><input class="in" data-k="venue" value="${esc(D.venue)}" placeholder="e.g. Mulungushi Conference Centre"></div>
        <div class="two"><div class="fld"><label>Date</label><input class="in" type="date" data-k="date" value="${D.date}" ${e ? "" : `min="${today()}"`}></div><div class="fld"><label>Start time</label><input class="in" type="time" data-k="time" value="${D.time}"></div></div>
        <div class="fld"><label>Short summary (shown under About)</label><input class="in" data-k="tagline" value="${esc(D.tagline)}" placeholder="One line that sells the event"></div>
        <div class="fld"><label>Full description</label><textarea class="in" data-k="desc" placeholder="Tell people what to expect">${esc(D.desc)}</textarea></div>
        <div class="fld"><label>Banner image</label><div class="up"><input type="file" accept="image/*" id="fi">${img ? `<img src="${img}" alt="">` : `<div>${I("img")}<br>Tap to upload a banner</div>`}</div></div>
        <h2 class="h2" style="margin-top:8px">Presenters</h2><p class="sub">People performing or speaking. Add a photo and name for each.</p>
        ${PR.map((x, i) => `<div class="pr"><label class="pth"><input type="file" accept="image/*" data-pi="${i}">${x.img ? `<img src="${x.img}" alt="">` : I("user")}</label><div class="pf"><input class="in" data-p="${i}" data-f="name" placeholder="Name" value="${esc(x.name)}"><input class="in" data-p="${i}" data-f="role" placeholder="Role (e.g. Headliner)" value="${esc(x.role || "")}"></div><button class="btn d sm" data-pr="${i}" aria-label="Remove">${I("trash")}</button></div>`).join("")}
        <button class="btn s b" id="ap" style="margin-bottom:8px">${I("plus")}Add presenter</button>
        <label class="chk"><input type="checkbox" data-k="featured" ${D.featured ? "checked" : ""}>Feature on the Explore tab</label>
        <h2 class="h2" style="margin-top:8px">Tickets</h2><p class="sub">Use 0 for free tickets. A ${fee}% platform fee applies.</p>
        ${T.map((t, i) => `<div class="tier"><input class="in" data-t="${i}" data-f="name" placeholder="Name" value="${esc(t.name)}"><input class="in" type="number" min="0" data-t="${i}" data-f="price" placeholder="Price" value="${t.price}"><input class="in" type="number" min="1" data-t="${i}" data-f="qty" placeholder="Qty" value="${t.qty}"><button class="btn d sm" data-rm="${i}" ${T.length === 1 || t.sold > 0 ? "disabled" : ""} aria-label="Remove">${I("trash")}</button></div>`).join("")}
        <button class="btn s b" id="at" style="margin-bottom:14px">${I("plus")}Add ticket type</button>
        <button class="btn b" id="sv">${e ? "Save changes" : "Publish event"}</button>`;
      m.querySelectorAll("[data-k]").forEach(i => i.oninput = i.onchange = () => D[i.dataset.k] = i.type === "checkbox" ? i.checked : i.value);
      m.querySelectorAll("[data-t]").forEach(i => i.oninput = () => T[i.dataset.t][i.dataset.f] = i.value);
      m.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { T.splice(+b.dataset.rm, 1); draw() });
      g("#at").onclick = () => { T.push({ name: "", price: "", qty: "", sold: 0 }); draw() };
      m.querySelectorAll("[data-p]").forEach(i => i.oninput = () => PR[i.dataset.p][i.dataset.f] = i.value);
      m.querySelectorAll("[data-pr]").forEach(b => b.onclick = () => { PR.splice(+b.dataset.pr, 1); draw() });
      m.querySelectorAll("[data-pi]").forEach(i => i.onchange = () => shrink(i.files[0], 400, u => { PR[i.dataset.pi].img = u; draw() }));
      g("#ap").onclick = () => { PR.push({ name: "", role: "", img: "" }); draw() };
      g("#fi").onchange = pick; g("#sv").onclick = save;
    };
    function pick(ev) {
      const f = ev.target.files[0]; if (!f) return; if (!f.type.startsWith("image/")) return toast("Choose an image file");
      const r = new FileReader();
      r.onload = x => { const im = new Image(); im.onload = () => { const s = Math.min(1, 900 / im.width), c = document.createElement("canvas"); c.width = im.width * s; c.height = im.height * s; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); img = c.toDataURL("image/jpeg", .78); draw() }; im.onerror = () => toast("Could not read that image"); im.src = x.target.result };
      r.readAsDataURL(f);
    }
    async function save() {
      for (const k of ["title", "category", "city", "venue", "date", "time"]) if (!String(D[k]).trim()) return toast("Please fill in all event details");
      if (!e && D.date < today()) return toast("Pick a date today or later");
      for (const t of T) {
        if (!String(t.name).trim()) return toast("Every ticket type needs a name");
        if (t.price === "" || +t.price < 0) return toast("Enter a valid price");
        if (t.qty === "" || +t.qty < 1) return toast("Enter a quantity");
        if (+t.qty < t.sold) return toast(`"${t.name}" already has ${t.sold} sold`);
      }
      const btn = g("#sv"); btn.disabled = true;
      const ev = { id: e ? e.id : uid("ev_"), owner: me.id, owner_name: me.name, title: D.title.trim(), category: D.category, city: D.city.trim(), venue: D.venue.trim(), date: D.date, time: D.time, description: D.desc.trim(), img,
        tiers: T.map(t => ({ name: t.name.trim(), price: +t.price || 0, qty: +t.qty, sold: t.sold || 0 })), featured: D.featured, tagline: D.tagline.trim(), presenters: PR.filter(x => String(x.name).trim()).map(x => ({ name: x.name.trim(), role: (x.role || "").trim(), img: x.img || "" })), status: "live" };
      const { error } = await (e ? sb.from("events").update(ev).eq("id", ev.id) : sb.from("events").insert(ev));
      if (error) { btn.disabled = false; return toast(error.message) }
      m.close(); toast(e ? "Event updated" : "Event published"); await loadAll(); rOrg(); rHome();
    }
    draw();
  });
}

/* ---------- ACCOUNT ---------- */
function rMe() {
  $("#ml").innerHTML = me ? `<div class="me"><div class="av">${esc((me.name || "U")[0].toUpperCase())}</div><h2>${esc(me.name || "")}</h2><p style="color:var(--t2);margin:6px 0 20px;font-size:.9rem">${esc(me.email || "")}<br>${esc(me.phone || "")}</p></div>
    <div class="grp"><div class="gi">${I("ticket")}<span>Tickets booked</span><span class="sp">${TIX.length}</span></div>${isOrg() ? `<div class="gi">${I("grid")}<span>Events created</span><span class="sp">${MINE.length}</span></div>` : ""}<div class="gi">${I("user")}<span>Account type</span><span class="sp">${me.role === "organiser" ? "Organiser" : me.role === "admin" ? "Admin" : "Customer"}</span></div></div>
    ${isOrg() ? "" : `<p class="hint c">Want to sell tickets? Create a separate organiser account.</p>`}
    <button class="btn d b" style="margin-top:20px" id="so">Sign out</button>`
    : `<div class="emp">${I("user")}<p>Sign in to book tickets and manage events.</p><button class="btn" style="margin-top:16px" onclick="openAuth()">Sign in or create account</button></div>`;
  if (USE_LOCAL) {
    $("#ml").insertAdjacentHTML("beforeend", '<button class="btn s b" id="rs" style="margin-top:12px">Reset local demo data</button><p class="hint c">Local mode: accounts, events and tickets are saved in this browser only.</p>');
    $("#rs").onclick = async () => { if (await ask("Reset demo data?", "This clears all local accounts, events and tickets.", "Reset", "d")) { Object.keys(localStorage).filter(k => k.startsWith("tz_")).forEach(k => localStorage.removeItem(k)); location.reload() } };
  }
  const b = $("#so"); if (b) b.onclick = async () => { if (await ask("Sign out?", "You can sign back in any time.", "Sign out", "d")) { await sb.auth.signOut(); me = null; MINE = []; TIX = []; go("home"); toast("Signed out") } };
}

/* ---------- INIT ---------- */
loadSaved();
updateFbtn();
(async () => {
  await loadMe(); await loadAll(); go("home");
  sb.auth.onAuthStateChange(async () => { await loadMe(); await loadAll(); if (tab === "home") rHome() });
})();
</script>
